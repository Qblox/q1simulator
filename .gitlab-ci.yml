spec:
  inputs:
    target:
      default: dummy
      options:
        - dummy
        - hardware
      description: "Run against the simulated (dummy) cluster or the real hardware."
    pytest_args:
      default: ""
      description: "Extra pytest arguments to choose what runs. Use a keyword like `-k loopback`, or one or more paths from the repo root separated by spaces, e.g. `tests/test_loopback_demo.py tests/test_nco_control.py`. Empty runs the whole suite."
---

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - q1simulator

include:
  - component: $CI_SERVER_FQDN/qblox/infrastructure/ci-components/q1simulator-ci@feat/DEVOPS-1467-github-report
    inputs:
      target: $[[ inputs.target ]]
      pytest_args: $[[ inputs.pytest_args ]]

      # Project and branch to find MR associated with
      # the pipeline that triggered this.
      project: qblox/q1simulator
      branch: ${CI_COMMIT_REF_NAME}

      # Token used for commenting on GitHub
      token: ${QBLOX_GITHUB_PAT}

      # Folder with test artifacts results
      # that will be commented back on the callers' MR.
      artifacts_directory: results/
      bucket_name: hil-artifacts

      # Same as version in component.
      gitlab_ref: feat/DEVOPS-1467-github-report
      gitlab_token: ${GITLAB_READ_SCRIPTS_TOKEN}

      # Google cloud authentication
      gcp_service_account_email: ${GCP_SERVICE_ACCOUNT_EMAIL}
      gcp_workload_identity_provider: ${GCP_WORKLOAD_IDENTITY_PROVIDER_URL}

      # Gitlab
      job_name: q1simulator
      stage: q1simulator
