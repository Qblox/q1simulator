spec:
  inputs:
    project:
      type: string
      description: GitHub project (owner/repo) to report test results to.
    token:
      type: string
      description: GitHub PAT to comment on behalf of.
    pr_number:
      type: string
      description: GitHub pull request number to comment on.
    needs:
      type: array
      description: 'Jobs to wait for before reporting, e.g. ["test on dummy"] or [{job: "test on hardware", optional: true}].'
    artifacts_url:
      type: string
      description: Link to download artifacts from GitLab.
---

report:github:
  stage: .post
  image: registry.gitlab.com/qblox/containers/glab:latest
  needs: $[[ inputs.needs ]]
  when: always
  variables:
    TOKEN: "$[[ inputs.token ]]"
    PR_NUMBER: "$[[ inputs.pr_number ]]"
    REPO: "$[[ inputs.project ]]"
  script:
    - bash .gitlab-ci/scripts/gh-comment.sh
